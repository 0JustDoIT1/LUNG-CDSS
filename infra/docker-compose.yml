services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    expose:
      - "80"
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    volumes:
      - ./gcs-key.json:/app/gcs-key.json:ro
      - ../backend/lung-cdss-firebase-adminsdk-fbsvc-f0ba31f18e.json:/app/lung-cdss-firebase-adminsdk-fbsvc-f0ba31f18e.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcs-key.json
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    expose:
      - "8000"
    restart: unless-stopped
    # depends_on:
    #   - postgres

  # postgres:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_DB: lung_cdss
  #     POSTGRES_USER: ${DB_USER}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

  # ── 신규: Celery(예약알림/복약알림/FCM발송/AI추론 대기 백그라운드 처리) ──
  # Django(backend)는 WSGI 그대로 유지, Redis는 Celery 브로커 전용으로만 사용.
  # 실시간 채팅/AI챗봇용 FastAPI(ASGI) 서비스 = realtime-service (아래 추가됨)
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: unless-stopped

  celery_worker:
    build:
      context: ../backend
    command: celery -A config worker -l info
    env_file:
      - ../backend/.env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcs-key.json
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - ./gcs-key.json:/app/gcs-key.json:ro
      - ../backend/lung-cdss-firebase-adminsdk-fbsvc-f0ba31f18e.json:/app/lung-cdss-firebase-adminsdk-fbsvc-f0ba31f18e.json:ro
    depends_on:
      - redis
    restart: unless-stopped

  celery_beat:
    build:
      context: ../backend
    command: celery -A config beat -l info
    env_file:
      - ../backend/.env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcs-key.json
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - ./gcs-key.json:/app/gcs-key.json:ro
      - ../backend/lung-cdss-firebase-adminsdk-fbsvc-f0ba31f18e.json:/app/lung-cdss-firebase-adminsdk-fbsvc-f0ba31f18e.json:ro
    depends_on:
      - redis
    restart: unless-stopped

  # 실시간 채팅 + AI챗봇(Genkit+MCP)
  realtime:
    build:
      context: ..
      dockerfile: realtime-service/Dockerfile
    env_file:
      - ../backend/.env
    environment:
      - DJANGO_INTERNAL_BASE_URL=http://backend:8000
      - REDIS_CHAT_URL=redis://redis:6379/2
    expose:
      - "8001"
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  # Genkit(Node.js) + MCP — 진짜 AI 챗봇 오케스트레이션.
  # MCP서버(개인데이터 tool)는 genkit-service 안에서 자식프로세스로 spawn됨
  # (mcpServer.js), FAISS 검색은 realtime 서비스의 /internal/rag/search 호출.
  genkit:
    build:
      context: ../genkit-service
    env_file:
      - ../backend/.env
    environment:
      - DJANGO_INTERNAL_BASE_URL=http://backend:8000
      - RAG_SEARCH_URL=http://realtime:8001/internal/rag/search
      - PORT=8002
    expose:
      - "8002"
    depends_on:
      - backend
      - realtime
    restart: unless-stopped

volumes:
  pgdata:
