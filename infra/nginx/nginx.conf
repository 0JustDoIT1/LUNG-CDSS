server {
    listen 80;
    server_name lung-cdss.kro.kr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lung-cdss.kro.kr;

    ssl_certificate /etc/letsencrypt/live/lung-cdss.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lung-cdss.kro.kr/privkey.pem;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 900s;
        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
    }

    # 실시간 채팅 — WebSocket 업그레이드 헤더 필수
    location /ws/ {
        proxy_pass http://realtime:8001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;  # 채팅 연결은 오래 유지되므로 넉넉하게
    }

    # AI 챗봇 (Genkit + MCP)
    location /ai/ {
        proxy_pass http://genkit:8002/ai/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}