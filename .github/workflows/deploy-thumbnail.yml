name: Deploy thumbnail-serving to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'thumbnail-serving/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        run: |
          docker buildx build \
            --cache-from type=registry,ref=us-central1-docker.pkg.dev/shining-lamp-492601-f9/lung-cdss-repo/thumbnail:buildcache \
            --cache-to type=registry,ref=us-central1-docker.pkg.dev/shining-lamp-492601-f9/lung-cdss-repo/thumbnail:buildcache,mode=max \
            -t us-central1-docker.pkg.dev/shining-lamp-492601-f9/lung-cdss-repo/thumbnail:latest \
            --push \
            ./thumbnail-serving

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy thumbnail-serving \
            --image=us-central1-docker.pkg.dev/shining-lamp-492601-f9/lung-cdss-repo/thumbnail:latest \
            --region=us-central1 \
            --memory=1Gi --cpu=1 --port=8000 --timeout=900 --concurrency=1 \
            --min-instances=0 --max-instances=3 --no-allow-unauthenticated
